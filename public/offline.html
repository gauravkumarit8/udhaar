<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Udhaar — connecting…</title>
    <!-- Everything here is inline on purpose: this page has to render when
         there is no network at all, so it cannot load a font, a stylesheet or
         a script from anywhere. It is shown by the native app (Capacitor
         `server.errorPath`) when the hosted app cannot be reached. -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(160deg, #064e3b 0%, #065f46 55%, #047857 100%);
        color: #ecfdf5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card { max-width: 22rem; width: 100%; }
      .logo {
        width: 72px; height: 72px; margin: 0 auto 20px;
        border-radius: 20px; background: rgba(255, 255, 255, 0.14);
        display: flex; align-items: center; justify-content: center; font-size: 36px;
      }
      h1 { font-size: 1.35rem; margin: 0 0 10px; }
      p { margin: 0 0 8px; font-size: 0.92rem; line-height: 1.5; color: #a7f3d0; }
      .hint { font-size: 0.8rem; color: #6ee7b7; }
      button {
        margin-top: 22px; width: 100%; padding: 15px 20px;
        font-size: 1rem; font-weight: 700; color: #064e3b;
        background: #ecfdf5; border: 0; border-radius: 14px;
      }
      button:active { background: #d1fae5; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">💰</div>
      <h1>Couldn't reach Udhaar</h1>
      <p>Your records are safe — nothing was lost. The app just needs a connection to load.</p>
      <p class="hint">If the site has been idle it can take up to a minute to wake up. Try again in a few seconds.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
