name: Build Android APK/AAB

on:
  workflow_call:
    inputs:
      build_type:
        description: "Build type: debug or release"
        required: false
        type: string
        default: "debug"
      app_url:
        description: "Deployed web app URL baked into server.url"
        required: false
        type: string
        default: "https://udhaar-y94f.onrender.com"
  # Not on every push to main - a full Android build per commit is noise.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type: debug or release"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      app_url:
        description: "Deployed web app URL (e.g. https://udhaar-y94f.onrender.com)"
        required: true
        default: "https://udhaar-y94f.onrender.com"

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    # The last step creates a GitHub Release for a tagged debug build. Without
    # `contents: write` the job's token is read-only (the default on modern
    # repositories) and that step fails with a 403 only on the one run that
    # matters - a release.
    permissions:
      contents: write

    env:
      APP_URL: ${{ inputs.app_url || 'https://udhaar-y94f.onrender.com' }}
      BUILD_TYPE: ${{ inputs.build_type || 'debug' }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 🟢 Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: 📱 Add Android platform
        run: npx cap add android

      - name: 🔧 Update Capacitor config with production URL
        run: |
          cat > /tmp/update-config.js << 'SCRIPT'
          const fs = require('fs');
          const config = fs.readFileSync('capacitor.config.ts', 'utf8');
          const updated = config.replace(
            /url:\s*['"][^'"]*['"]/g,
            `url: '${process.env.APP_URL}'`
          );
          fs.writeFileSync('capacitor.config.ts', updated);
          SCRIPT
          node /tmp/update-config.js

      - name: 📋 Copy web assets
        run: npx cap copy android

      - name: 🔧 Sync native project
        run: npx cap sync android

      # Firebase Cloud Messaging needs this file inside the Android project -
      # without it the push plugin's registration always fails, which is why
      # "notifications never arrive" was true even for a built APK. Add the
      # file from the Firebase console (Project settings → Your apps →
      # google-services.json) as the secret ANDROID_GOOGLE_SERVICES_JSON,
      # base64-encoded. Skipped when the secret is not set, so builds keep
      # working without it.
      - name: 🔥 Add Firebase config (if provided)
        if: env.GOOGLE_SERVICES_JSON != ''
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          echo "::notice::google-services.json added - this build can receive push notifications"

      - name: 🔑 Decode keystore (release only)
        if: env.BUILD_TYPE == 'release'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/udhaar.keystore
          echo "KEYSTORE_FILE=udhaar.keystore" >> android/gradle.properties
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/gradle.properties
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/gradle.properties
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/gradle.properties

      - name: 🏗️ Build Android APK (debug)
        if: env.BUILD_TYPE == 'debug'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: 🏗️ Build Android AAB (release)
        if: env.BUILD_TYPE == 'release'
        working-directory: android
        run: ./gradlew bundleRelease

      - name: 📤 Upload APK artifact
        if: env.BUILD_TYPE == 'debug'
        uses: actions/upload-artifact@v7
        with:
          name: udhaar-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 📤 Upload AAB artifact
        if: env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: udhaar-release.aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: 🎉 Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') && env.BUILD_TYPE == 'debug'
        uses: softprops/action-gh-release@v3
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
