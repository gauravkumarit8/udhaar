name: Build Android APK/AAB

on:
  workflow_call:
    inputs:
      build_type:
        description: "Build type: debug or release"
        required: false
        type: string
        default: "debug"
      app_url:
        description: "Deployed web app URL baked into server.url"
        required: false
        type: string
        default: "https://udhaar-y94f.onrender.com"
  # Every merge to main produces an installable APK artifact, so the app can be
  # tried on a real phone without waiting for a release. The build takes about
  # ten minutes and uploads one artifact for 30 days.
  #
  # Deliberately NOT on a tag: release.yml calls this workflow on a tag, and
  # also ran it directly before - two builds, two jobs uploading an artifact of
  # the same name, and two attempts to create the same GitHub Release. One
  # trigger, one path.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type: debug or release"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      app_url:
        description: "Deployed web app URL (e.g. https://udhaar-y94f.onrender.com)"
        required: true
        default: "https://udhaar-y94f.onrender.com"

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    # The last step creates a GitHub Release for a tagged debug build. Without
    # `contents: write` the job's token is read-only (the default on modern
    # repositories) and that step fails with a 403 only on the one run that
    # matters - a release.
    permissions:
      contents: write

    env:
      APP_URL: ${{ inputs.app_url || 'https://udhaar-y94f.onrender.com' }}
      BUILD_TYPE: ${{ inputs.build_type || 'debug' }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 🟢 Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: 📱 Add Android platform
        run: npx cap add android

      # `cap add` draws Capacitor's stock icon and splash. The real artwork is
      # committed under native/android/res/ (regenerate with
      # ./scripts/generate-android-icons.sh) and mirrored over the generated
      # project here - the android/ directory itself is generated and ignored,
      # so anything committed inside it would vanish on the next `cap add`.
      - name: 🎨 Apply Udhaar icon, splash and notification icon
        run: |
          if [ ! -d native/android/res ]; then
            echo "::warning::native/android/res is missing - the APK will ship Capacitor's stock artwork"
            exit 0
          fi
          cp -R native/android/res/. android/app/src/main/res/
          echo "::notice::branded launcher, splash and notification icons applied"

      # Two rewrites, both build-time:
      #
      # 1. point the WebView at the deployment (the app is a remote shell);
      # 2. advertise, in the WebView's user agent, whether THIS build shipped
      #    google-services.json.
      #
      # (2) is what keeps the app alive. Without Firebase, the native
      # PushNotifications.register() call throws and Capacitor rethrows it on the
      # main thread, killing the process - it crashed the app on the first screen
      # after login. The web app only reaches for the plugin when the user agent
      # carries the marker, and the installed APKs from before this change carry
      # none, so they stop calling it the moment the fix deploys.
      - name: 🔧 Update Capacitor config with production URL
        env:
          PUSH_MARKER: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON != '' && 'UdhaarPush/1' || '' }}
        run: |
          cat > /tmp/update-config.js << 'SCRIPT'
          const fs = require('fs');
          let config = fs.readFileSync('capacitor.config.ts', 'utf8');

          config = config.replace(
            /url:\s*['"][^'"]*['"]/g,
            `url: '${process.env.APP_URL}'`
          );

          const marker = process.env.PUSH_MARKER || '';
          if (marker && !config.includes('appendUserAgent')) {
            config = config.replace(/android:\s*\{/, `android: {\n    appendUserAgent: '${marker}',`);
          }
          fs.writeFileSync('capacitor.config.ts', config);
          SCRIPT
          node /tmp/update-config.js
          echo "::notice::user agent marker: ${PUSH_MARKER:-none (this APK will not ask for a push token)}"
          grep -n "appendUserAgent" capacitor.config.ts || true

      - name: 📋 Copy web assets
        run: npx cap copy android

      - name: 🔧 Sync native project
        run: npx cap sync android

      # Firebase Cloud Messaging needs this file inside the Android project -
      # without it the push plugin's registration always fails, which is why
      # "notifications never arrive" was true even for a built APK. Add the
      # file from the Firebase console (Project settings → Your apps →
      # google-services.json) as the secret ANDROID_GOOGLE_SERVICES_JSON,
      # base64-encoded. Skipped when the secret is not set, so builds keep
      # working without it.
      - name: 🔥 Add Firebase config (if provided)
        if: env.GOOGLE_SERVICES_JSON != ''
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          # A config file for another package does not initialize Firebase in
          # this one - the google-services plugin skips it - while the user-agent
          # marker above would still promise the app it is safe to register.
          # That is the crash again, so refuse to build such an APK.
          if ! node -e '
            const cfg = require("./android/app/google-services.json");
            const ids = (cfg.client || []).map((c) => c.client_info?.android_client_info?.package_name);
            const ok = ids.some((id) => id === "com.udhaar.app") && Boolean(cfg.project_info?.project_number);
            process.exit(ok ? 0 : 1);
          '; then
            echo "::error::google-services.json does not describe com.udhaar.app (or has no project_number), so Firebase would not initialize in this APK. Fix the secret or remove it."
            exit 1
          fi
          echo "::notice::google-services.json added for com.udhaar.app - this build can receive push notifications"

      # Without this file the google-services plugin is not applied, FirebaseApp
      # is never initialized, and the native PushNotifications.register() call
      # throws - which Capacitor rethrows on the main thread, killing the app.
      # The web app now asks the server before calling it, so a build without
      # this file is safe; it simply cannot receive app pushes. Say so loudly,
      # because the two halves have to be configured together: FCM on the server
      # (FIREBASE_SERVICE_ACCOUNT_KEY) and this file in the APK.
      - name: 🔥 Warn when the APK cannot receive app pushes
        if: env.GOOGLE_SERVICES_JSON == ''
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          echo "::warning::ANDROID_GOOGLE_SERVICES_JSON is not set - this APK cannot receive app push notifications. Add the base64-encoded google-services.json, and only enable FIREBASE_SERVICE_ACCOUNT_KEY on the server once it is set here too."

      - name: 🔑 Decode keystore (release only)
        if: env.BUILD_TYPE == 'release'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/udhaar.keystore
          echo "KEYSTORE_FILE=udhaar.keystore" >> android/gradle.properties
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/gradle.properties
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/gradle.properties
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/gradle.properties

      # Capacitor 8 generates a project that targets compileSdk 36; Gradle will
      # try to download that platform on first use, and refuses when the licences
      # have not been accepted on the runner.
      - name: 🧰 Accept Android SDK licences
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 🔎 Toolchain (printed so a failure explains itself)
        run: |
          echo "::notice::java $(java -version 2>&1 | head -1)"
          echo "::notice::compileSdk $(grep compileSdkVersion android/variables.gradle | tr -d ' ')"
          echo "::notice::platforms installed: $(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "::notice::build-tools installed: $(ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' ')"

      - name: 🏗️ Build Android APK (debug)
        if: env.BUILD_TYPE == 'debug'
        working-directory: android
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace > /tmp/gradle.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            # A job log lives in storage a restricted client may not be able to
            # open, so the reason is published as annotations too - the same
            # reason verify-settlement.mjs prints ::error:: lines. The tail of a
            # Gradle failure is a stack trace; the sentence that explains it is
            # in the "What went wrong" block, so that is what gets lifted out.
            {
              sed -n '/What went wrong/,/^\* Try/p' /tmp/gradle.log | head -n 22
              grep -E "^Execution failed for task|^Caused by:|^e: |error: " /tmp/gradle.log | head -n 6
            } | while IFS= read -r line; do
              echo "::error file=android/variables.gradle::$line"
            done
            exit "$status"
          fi

      - name: 🏗️ Build Android AAB (release)
        if: env.BUILD_TYPE == 'release'
        working-directory: android
        run: ./gradlew bundleRelease

      - name: 📤 Upload APK artifact
        if: env.BUILD_TYPE == 'debug'
        uses: actions/upload-artifact@v7
        with:
          name: udhaar-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 📤 Upload AAB artifact
        if: env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: udhaar-release.aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # No release step here: release.yml calls this workflow on a tag and its
      # create-release job downloads the artifact uploaded above. Both creating
      # a release meant two releases racing for the same tag.
