name: CI — Lint, Typecheck, Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      # The schema is built from the checked-in SQL migrations, not from a
      # push, so CI proves the migrations actually produce a working database.
      - name: 🗄️ Apply migrations to a fresh database
        run: npm run db:migrate

      - name: 🧭 Verify the migrations match schema.ts
        run: |
          npx drizzle-kit generate --name=ci_drift_check
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::drizzle/ is out of date - run 'npm run db:generate' and commit the result"
            git status --short drizzle/
            exit 1
          fi
          echo "migrations are in sync with the schema"

      - name: 🩺 Deployment check (the same command users run)
        run: npm run check-deploy

      - name: 🔍 Type generation
        run: npx next typegen

      - name: 🔍 TypeScript check
        run: npx tsc --noEmit

      - name: 🧹 Lint
        run: npm run lint

      - name: 🧪 Unit tests
        run: npm test

      - name: 🏗️ Build Next.js
        run: npm run build

      - name: 🐳 Build Docker image
        run: docker build -t udhaar:ci .

      - name: ✅ All checks passed
        run: echo "🎉 CI passed!"

  migrations:
    name: Migrations adopt an existing database
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      # The service container requires a password; libpq reads PGPASSWORD.
      PGPASSWORD: postgres

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      # Databases created by `drizzle-kit push` (the documented path users
      # followed before migrations existed) have the tables but no migration
      # journal, so `db:migrate` alone would trip over "relation already
      # exists". This is the exact upgrade path a real deployment takes.
      - name: 🗄️ Build the schema the old way
        run: npx drizzle-kit push --force

      - name: 🧱 Baseline the migrations onto it
        run: npm run db:baseline

      - name: ⏭️ Migrations must now be a clean no-op
        run: npm run db:migrate

      - name: 🩺 The database must still pass the deployment check
        run: npm run check-deploy

      # The failure that actually bit a deployment: the database was created by
      # `db:push` *before* a later migration existed, so it sits at an older
      # schema. A baseline that records every migration in the journal without
      # looking at the database marks the newer one applied, `db:migrate`
      # reports success having done nothing, and the column never appears.
      - name: 🕰️ A database left behind by an older push
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/legacy_db
        run: |
          psql -h 127.0.0.1 -U postgres -c 'create database legacy_db'
          psql -h 127.0.0.1 -U postgres -d legacy_db -q -f drizzle/0000_initial_schema.sql
          test "$(psql -h 127.0.0.1 -U postgres -d legacy_db -At -c "select count(*) from information_schema.columns where table_name = 'reminders' and column_name = 'dedupe_key'")" = "0"
          npm run db:baseline | tee "$RUNNER_TEMP/baseline.log"
          grep -q "recorded as already applied: 0000_initial_schema" "$RUNNER_TEMP/baseline.log"
          grep -q "Still to apply: 0001_reminder_dedupe_key" "$RUNNER_TEMP/baseline.log"
          test "$(psql -h 127.0.0.1 -U postgres -d legacy_db -At -c 'select count(*) from drizzle.__drizzle_migrations')" = "1"

      - name: 🧱 …the pending migration must really be applied
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/legacy_db
        run: |
          npm run db:migrate
          test "$(psql -h 127.0.0.1 -U postgres -d legacy_db -At -c "select count(*) from information_schema.columns where table_name = 'reminders' and column_name = 'dedupe_key'")" = "1"
          npm run check-deploy

      # What an older, too-trusting baseline left behind: the journal claims a
      # migration that the database does not actually have. Baseline has to
      # remove that record, because Drizzle only applies migrations newer than
      # the newest row, so the claim alone stops `db:migrate` from running it.
      - name: 🧾 A journal that claims more than the database has
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/stale_db
        run: |
          psql -h 127.0.0.1 -U postgres -c 'create database stale_db'
          psql -h 127.0.0.1 -U postgres -d stale_db -q -f drizzle/0000_initial_schema.sql
          node -e 'const c=require("node:crypto"),f=require("node:fs");const j=JSON.parse(f.readFileSync("drizzle/meta/_journal.json","utf8"));console.log(j.entries.map((e)=>c.createHash("sha256").update(f.readFileSync("drizzle/"+e.tag+".sql")).digest("hex")+" "+e.when).join("\n"))' > "$RUNNER_TEMP/rows.txt"
          psql -h 127.0.0.1 -U postgres -d stale_db -c 'create schema drizzle'
          psql -h 127.0.0.1 -U postgres -d stale_db -c 'create table drizzle.__drizzle_migrations (id serial primary key, hash text not null, created_at bigint)'
          while read -r hash ts; do
            psql -h 127.0.0.1 -U postgres -d stale_db -c "insert into drizzle.__drizzle_migrations (hash, created_at) values ('$hash', $ts)"
          done < "$RUNNER_TEMP/rows.txt"
          npm run db:baseline | tee "$RUNNER_TEMP/baseline.log"
          grep -q 'removed an incorrect "applied" record: 0001_reminder_dedupe_key' "$RUNNER_TEMP/baseline.log"
          npm run db:migrate
          test "$(psql -h 127.0.0.1 -U postgres -d stale_db -At -c "select count(*) from information_schema.columns where table_name = 'reminders' and column_name = 'dedupe_key'")" = "1"
          npm run check-deploy

      - name: ✅ Migration path verified
        run: echo "🎉 Push-created and drifted databases both upgrade to migrations cleanly"
