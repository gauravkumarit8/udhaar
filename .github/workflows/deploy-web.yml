name: Deploy Web — Docker Image + Release

on:
  workflow_call:
    inputs:
      deploy:
        description: "Trigger the Render deploy hook (takes effect on tag builds)"
        required: false
        type: boolean
        default: false
  # A manual run from the Actions tab deploys by default - this is the button
  # to press when you want the live app updated without pushing anything.
  workflow_dispatch:
    inputs:
      deploy:
        description: "Trigger the Render deploy hook after building the image"
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔐 Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamped into the image (and reported by /api/health) so a running
          # deployment can be told apart from the one before it.
          build-args: |
            GIT_SHA=${{ github.sha }}

  deploy-render:
    name: Deploy to Render
    needs: build-and-push
    runs-on: ubuntu-latest
    # RENDER OWNS DEPLOYS ON MAIN. Its own auto-deploy fires on every push to
    # main; this job deliberately does not, because running both meant each
    # commit queued two deploys of the same code. What is left here is what
    # Render cannot do by itself: deploy a *tag* (a release), and a button for
    # "deploy now" from the Actions tab without pushing anything.
    #
    # Related, not repeated here: the image build above still runs on every
    # push to main, since a `main`-tagged image is an artifact people pull -
    # building is not deploying.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy
    steps:
      - name: 🚀 Trigger Render Deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK is not set - nothing was triggered. Add it under Settings → Secrets and variables → Actions → New repository secret to deploy from here."
            exit 0
          fi

          # The old version piped the response straight out and carried
          # continue-on-error, so a revoked hook or a bad URL still showed a
          # green tick. Now a rejected deploy fails the job.
          response=$(curl -sS --fail-with-body -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}") || {
            echo "::error::Render rejected the deploy hook. Check RENDER_DEPLOY_HOOK is the current hook for the service."
            exit 1
          }

          echo "$response"
          deploy_id=$(echo "$response" | python3 -c "import json,sys; print(json.load(sys.stdin).get('deploy',{}).get('id',''))" 2>/dev/null || true)
          if [ -n "$deploy_id" ]; then
            echo "::notice::Render accepted the deploy ($deploy_id). Watch it at https://dashboard.render.com"
          fi

  verify-production:
    name: Verify the deploy is live and healthy
    needs: build-and-push
    runs-on: ubuntu-latest
    # "The workflow went green" used to mean "the image was built and Render was
    # told". It did not mean the new code was answering, let alone that the
    # database behind it had the columns that code selects - on 2026-10-14 the
    # borrower-side release was live with its migration unapplied, and every
    # loan screen answered 503 while the runs above were green.
    #
    # So the release is not finished until the deployed app says it is running
    # *this* commit and that it is healthy, which is what this job asks. It
    # polls, because a host takes minutes to roll a container over.
    #
    # Deliberately not `needs: deploy-render`: that job is skipped on main (the
    # host deploys itself), and a skipped need would skip this too.
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 🩺 Ask the deployed app what it is running
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://udhaar-y94f.onrender.com' }}
          EXPECTED_SHA: ${{ github.sha }}
          TIMEOUT_MS: "900000"
        run: node scripts/verify-deployment.mjs
