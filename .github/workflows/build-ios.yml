name: Build iOS IPA

on:
  workflow_call:
    inputs:
      app_url:
        description: "Deployed web app URL baked into server.url"
        required: false
        type: string
        default: "https://udhaar-y94f.onrender.com"
  # Not on every push to main - this job needs macOS minutes and an Apple
  # certificate, neither of which should be spent per commit.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      app_url:
        description: "Deployed web app URL (e.g. https://udhaar-y94f.onrender.com)"
        required: true
        default: "https://udhaar-y94f.onrender.com"

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-14

    env:
      APP_URL: ${{ inputs.app_url || 'https://udhaar-y94f.onrender.com' }}
      # Secrets can't be tested directly in a step `if:`, so resolve presence
      # into an env flag first. Without a certificate/provisioning profile the
      # signing steps used to fail the whole job on every push.
      SIGNING_CONFIGURED: ${{ secrets.IOS_P12_BASE64 != '' && secrets.IOS_PROVISION_PROFILE_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: ☕ Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📱 Add iOS platform
        run: npx cap add ios

      - name: 🔧 Update Capacitor config with production URL
        run: |
          cat > /tmp/update-config.js << 'SCRIPT'
          const fs = require('fs');
          const config = fs.readFileSync('capacitor.config.ts', 'utf8');
          const updated = config.replace(
            /url:\s*['"][^'"]*['"]/g,
            `url: '${process.env.APP_URL}'`
          );
          fs.writeFileSync('capacitor.config.ts', updated);
          SCRIPT
          node /tmp/update-config.js

      - name: 📋 Copy web assets
        run: npx cap copy ios

      - name: 🔧 Sync native project
        run: npx cap sync ios

      - name: ⚠️ Skip notice (no signing credentials)
        if: env.SIGNING_CONFIGURED != 'true'
        run: |
          echo "::warning::IOS_P12_BASE64 / IOS_PROVISION_PROFILE_BASE64 / APPLE_TEAM_ID are not set."
          echo "Skipping the signed archive. The web app is deployed independently; add the"
          echo "secrets listed in README.md → GitHub Secrets to build an IPA."

      - name: 🔑 Install Apple Certificate
        if: env.SIGNING_CONFIGURED == 'true'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}

      - name: 📲 Install Provisioning Profile
        if: env.SIGNING_CONFIGURED == 'true'
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/Udhaar.mobileprovision

      - name: 🏗️ Build iOS Archive
        if: env.SIGNING_CONFIGURED == 'true'
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"

      - name: 📦 Export IPA
        if: env.SIGNING_CONFIGURED == 'true'
        working-directory: ios/App
        run: |
          mkdir -p build/export
          cat > build/export/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist build/export/ExportOptions.plist \
            -exportPath build/ipa

      - name: 📤 Upload IPA artifact
        if: env.SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: udhaar.ipa
          path: ios/App/build/ipa/*.ipa
          retention-days: 30

      - name: 🚀 Upload to App Store Connect
        if: env.SIGNING_CONFIGURED == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file ios/App/build/ipa/*.ipa \
            --apiKey "${{ secrets.APP_STORE_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_API_ISSUER_ID }}"
        continue-on-error: true
