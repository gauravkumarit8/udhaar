services:
  - type: web
    name: udhaar
    runtime: node
    plan: free
    # `output: standalone` does NOT copy static assets into .next/standalone,
    # so they're staged in explicitly here (the Dockerfile does the same).
    buildCommand: npm ci && npm run build && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public
    # Migrations run on every boot and are a no-op once applied:
    # scripts/migrate-at-boot.mjs is the same two steps this used to spell out
    # (`npm run db:baseline`, which adopts a database that predates the journal,
    # then `npm run db:migrate`), in one script the Docker image also runs - so
    # there is a single migration path whether the host starts a container or
    # runs the server directly. If the database is unreachable the app still
    # starts, so /api/health can explain what is wrong instead of the deploy
    # failing with no visible reason. (Render's free tier has no
    # preDeployCommand.) deploy-web.yml's verify-production job is what turns a
    # silent miss into a red build.
    startCommand: node scripts/migrate-at-boot.mjs || echo "migration check failed - see /api/health"; node .next/standalone/server.js
    healthCheckPath: /api/health
    envVars:
      # Set in the Render dashboard (Neon/Supabase/Aiven or any external
      # Postgres). Deliberately NOT a Render-managed database: free Render
      # Postgres instances are deleted 30 days after creation, taking the data
      # with them - that is what broke this app once already.
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      # Browser push. Generate with `npm run generate:vapid` and paste both
      # values: without them the website (and an installed PWA) can never be
      # notified, because FCM only reaches the native app.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:noreply@udhaar.app
      # Remove this once MSG91 is configured, or real OTPs will never be sent.
      - key: OTP_MODE
        value: dummy
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_FLOW_ID
        sync: false

# No `databases:` block on purpose. Render's free Postgres expires 30 days
# after creation (then gets deleted, with no backups), which is exactly how
# login broke in production. Point DATABASE_URL at an external free database
# (Neon, Supabase, Aiven) and run `npm run db:migrate` once against it.
