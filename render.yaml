services:
  - type: web
    name: udhaar
    runtime: node
    plan: free
    # `output: standalone` does NOT copy static assets into .next/standalone,
    # so they're staged in explicitly here (the Dockerfile does the same).
    buildCommand: npm ci && npm run build && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public
    # Migrations run on every boot and are a no-op once applied:
    # scripts/migrate-at-boot.mjs is the same two steps this used to spell out
    # (`npm run db:baseline`, which adopts a database that predates the journal,
    # then `npm run db:migrate`), in one script the Docker image also runs - so
    # there is a single migration path whether the host starts a container or
    # runs the server directly. If the database is unreachable the app still
    # starts, so /api/health can explain what is wrong instead of the deploy
    # failing with no visible reason. (Render's free tier has no
    # preDeployCommand.) deploy-web.yml's verify-production job is what turns a
    # silent miss into a red build.
    startCommand: node scripts/migrate-at-boot.mjs || echo "migration check failed - see /api/health"; node .next/standalone/server.js
    healthCheckPath: /api/health
    envVars:
      # Set in the Render dashboard (Neon/Supabase/Aiven or any external
      # Postgres). Deliberately NOT a Render-managed database: free Render
      # Postgres instances are deleted 30 days after creation, taking the data
      # with them - that is what broke this app once already.
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      # Browser push. Generate with `npm run generate:vapid` and paste both
      # values: without them the website (and an installed PWA) can never be
      # notified, because FCM only reaches the native app.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:noreply@udhaar.app
      # Remove this once MSG91 is configured, or real OTPs will never be sent.
      - key: OTP_MODE
        value: dummy
      # The OTP ceilings. Both are counted in the database, so neither can be
      # reset by a restart or dodged by rotating an IP: 10 OTPs a day for one
      # number, 300 an hour across everyone. Raise the second one if a lot of
      # real users ever log in at the same time.
      - key: OTP_PER_MOBILE_DAILY_MAX
        value: "10"
      - key: OTP_GLOBAL_HOURLY_MAX
        value: "300"
      # Where the app may be embedded. 'none' (nobody may frame it) is also the
      # code default; it is spelled out here because it is a BUILD-time value -
      # change it here and redeploy, or the build keeps the old one.
      - key: FRAME_ANCESTORS
        value: "'none'"
      # WhatsApp reminders (optional, paid, and OFF with no provider - see the
      # README for costs and the template to submit). Uncomment these four and
      # fill them in to have the scheduled sweep send the message itself
      # instead of leaving it to the lender's one-tap share.
      # - key: WHATSAPP_PROVIDER
      #   value: meta
      # - key: WHATSAPP_TOKEN
      #   sync: false
      # - key: WHATSAPP_PHONE_NUMBER_ID
      #   sync: false
      # - key: WHATSAPP_BUSINESS_ACCOUNT_ID
      #   sync: false
      # - key: WHATSAPP_APP_SECRET
      #   sync: false
      # - key: WHATSAPP_VERIFY_TOKEN
      #   sync: false
      # - key: WHATSAPP_DAILY_MAX
      #   value: "200"
      # - key: WHATSAPP_TO_UNREGISTERED
      #   value: "false"
      # Set in the Render dashboard to a long random string. Send it as the
      # `x-health-token` header to /api/health to see the full diagnosis (the
      # database host, which integrations are configured, the error text behind
      # a failure). Without it, that detail is hidden from everyone, including
      # the deploy verifier, which is why the public body carries the remedy.
      - key: HEALTH_TOKEN
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_FLOW_ID
        sync: false

# No `databases:` block on purpose. Render's free Postgres expires 30 days
# after creation (then gets deleted, with no backups), which is exactly how
# login broke in production. Point DATABASE_URL at an external free database
# (Neon, Supabase, Aiven) and run `npm run db:migrate` once against it.
