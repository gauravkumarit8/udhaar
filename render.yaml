services:
  - type: web
    name: udhaar
    runtime: node
    plan: free
    # `output: standalone` does NOT copy static assets into .next/standalone,
    # so they're staged in explicitly here (the Dockerfile does the same).
    buildCommand: npm ci && npm run build && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public
    startCommand: node .next/standalone/server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: udhaar-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      # Remove this once MSG91 is configured, or real OTPs will never be sent.
      - key: OTP_MODE
        value: dummy
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_FLOW_ID
        sync: false

databases:
  - name: udhaar-db
    plan: free
